<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WPStudBook</title>
    <style>
      /* ── 色彩與字體（設計決策 9 節）──────────────────────────── */
      :root {
        color-scheme: light;
        --ink: #16202a;
        --ink-2: #3d4a43;
        --muted: #56655b;
        --paper: #f3f5f2;
        --surface: #ffffff;
        --surface-2: #f7f9f6;
        --rail: #d6ddd7;
        --rail-strong: #a9b5ac;
        --turf: #1f6b4f;
        --turf-dark: #17533d;
        --turf-soft: #e3f0e9;
        --dirt: #7a4f12;
        --dirt-soft: #fbf1df;
        --dirt-rail: #e6c998;
        --silk-red: #b42318;
        --silk-red-soft: #fdecea;
        --drawer: #1565c0;
        --drawer-soft: #eef4fc;
        --drawer-rail: #c9d7ea;
        --focus: #0b57d0;
        --radius: 8px;
        --radius-sm: 6px;
        --shadow: 0 1px 2px rgb(22 32 42 / 6%), 0 2px 8px rgb(22 32 42 / 5%);
        --font-ui:
          'Segoe UI Variable Text', 'Segoe UI', 'Microsoft JhengHei UI', 'Microsoft JhengHei',
          'Yu Gothic UI', 'Meiryo UI', system-ui, sans-serif;
        --font-display:
          'Segoe UI Variable Display', 'Segoe UI', 'Microsoft JhengHei UI', 'Microsoft JhengHei',
          system-ui, sans-serif;
        --font-code: 'Cascadia Mono', Consolas, ui-monospace, monospace;
        font-family: var(--font-ui);
        line-height: 1.55;
        background: var(--paper);
        color: var(--ink);
      }
      body {
        margin: 0;
      }
      .app {
        max-width: 80rem;
        margin: 0 auto;
        padding: 0 1.25rem 3rem;
        overflow-wrap: anywhere;
      }
      h1,
      h2,
      h3,
      h4 {
        font-family: var(--font-display);
        line-height: 1.3;
      }
      h2 {
        margin: 0 0 1rem;
        font-size: 1.375rem;
        font-weight: 700;
      }
      h3 {
        margin: 1.5rem 0 0.625rem;
        font-size: 1.0625rem;
        font-weight: 700;
      }
      h4 {
        margin: 1rem 0 0.5rem;
        font-size: 1rem;
      }
      p {
        margin: 0.5rem 0;
      }
      code {
        font-family: var(--font-code);
        font-size: 0.875em;
      }
      .notice {
        color: var(--muted);
        font-size: 0.875rem;
      }

      /* ── 頂部狀態列：出馬表的表頭 ─────────────────────────────── */
      .status-bar {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: baseline;
        column-gap: 0.75rem;
        margin: 0 -1.25rem;
        padding: 1rem 1.5rem 0.875rem;
        border-radius: 0 0 var(--radius) var(--radius);
        background: var(--ink);
        color: #e9eee9;
      }
      .status-bar > * {
        grid-column: 1 / -1;
      }
      .status-bar h1 {
        grid-column: 1;
        margin: 0;
        font-size: 1.375rem;
        letter-spacing: 0.01em;
      }
      .status-bar [data-testid='app-version'] {
        grid-column: 2;
        margin: 0;
        color: #9fb0a5;
        font-size: 0.8125rem;
      }
      .status-bar dl {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.5rem;
        margin: 0.875rem 0 0;
        padding-top: 0.75rem;
        border-top: 1px solid rgb(255 255 255 / 14%);
      }
      .status-bar dl > div {
        display: block;
        padding: 0;
        border: 0;
      }
      .status-bar dt {
        color: #9fb0a5;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
      }
      .status-bar dd {
        margin: 0;
        color: #ffffff;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .status-bar [data-testid='status-game'],
      .status-bar [data-testid='status-year'],
      .status-bar [data-testid='status-records'] {
        font-family: var(--font-display);
        font-size: 1.25rem;
        font-weight: 700;
      }
      .status-bar [data-testid='status-save'],
      .status-bar [data-testid='status-persistence'],
      .status-bar [data-testid='status-backup'],
      .status-bar [data-testid='status-checkpoint'] {
        font-size: 0.875rem;
        font-weight: 500;
      }
      .status-bar .notice {
        margin: 0.625rem 0 0;
        color: #b4c2b8;
        font-size: 0.8125rem;
      }
      .status-bar [role='alert'] {
        margin: 0.5rem 0 0;
      }

      /* ── 主要頁面：頁籤 ─────────────────────────────────────── */
      .main-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.125rem;
        margin: 0.75rem 0 1.25rem;
        border-bottom: 1px solid var(--rail);
      }
      .main-nav button {
        min-height: 0;
        margin-bottom: -1px;
        padding: 0.625rem 0.875rem;
        border: 0;
        border-bottom: 3px solid transparent;
        border-radius: 0;
        background: none;
        color: var(--ink-2);
        font-weight: 600;
      }
      .main-nav button:hover {
        border-bottom-color: var(--rail-strong);
        background: none;
        color: var(--ink);
      }
      .main-nav button[aria-current='page'] {
        border-bottom-color: var(--turf);
        color: var(--turf-dark);
        font-weight: 700;
      }

      /* ── 版面：頁面與卡片 ───────────────────────────────────── */
      main > section {
        margin: 0 0 1rem;
        padding: 1.25rem 1.5rem 1.5rem;
        border: 1px solid var(--rail);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      main > section section {
        margin-top: 1.5rem;
        padding-top: 0.25rem;
        border-top: 1px solid var(--rail);
      }
      main > section.dashboard {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr));
        gap: 1rem;
        align-items: start;
        padding: 0;
        border: 0;
        background: none;
        box-shadow: none;
      }
      .dashboard > :not(section) {
        grid-column: 1 / -1;
        margin: 0;
      }
      .dashboard > section {
        min-width: 0;
        margin: 0;
        padding: 1rem 1.25rem 1.25rem;
        border: 1px solid var(--rail);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .dashboard > section > h3:first-child {
        margin-top: 0;
      }
      .dashboard > section[aria-labelledby='line-cards-heading'],
      .dashboard > section[aria-labelledby='task-board-heading'],
      .dashboard > section[aria-labelledby='recovery-heading'] {
        grid-column: 1 / -1;
      }
      main > section.danger-zone {
        border-color: #e3a29b;
        background: #fffbfa;
        box-shadow: none;
      }
      .danger-zone h2 {
        color: var(--silk-red);
      }
      .danger-zone button {
        border-color: #d98b83;
        color: var(--silk-red);
      }
      .danger-zone button:hover {
        background: var(--silk-red-soft);
      }

      /* ── 按鈕 ───────────────────────────────────────────────── */
      button {
        min-height: 2.25rem;
        padding: 0.375rem 0.875rem;
        border: 1px solid var(--rail-strong);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-size: 0.9375rem;
        line-height: 1.3;
        cursor: pointer;
        transition:
          background-color 120ms,
          border-color 120ms;
      }
      button:hover {
        border-color: #87958b;
        background: #eef2ee;
      }
      button:active,
      button[data-pressed] {
        background: #e2e9e4;
      }
      button:disabled,
      button[data-disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button[type='submit'],
      .dialog-actions > button:last-child {
        border-color: var(--turf);
        background: var(--turf);
        color: #ffffff;
        font-weight: 600;
      }
      button[type='submit']:hover,
      .dialog-actions > button:last-child:hover {
        border-color: var(--turf-dark);
        background: var(--turf-dark);
      }
      [role='alertdialog'] .dialog-actions > button:last-child {
        border-color: var(--silk-red);
        background: var(--silk-red);
      }
      [role='alertdialog'] .dialog-actions > button:last-child:hover {
        border-color: #8f1c13;
        background: #8f1c13;
      }
      .link-button {
        min-height: 0;
        padding: 0;
        border: 0;
        background: none;
        color: var(--ink);
        font: inherit;
        font-weight: 700;
        text-align: left;
        text-decoration: underline;
        text-decoration-color: var(--rail-strong);
        text-underline-offset: 0.2em;
        cursor: pointer;
      }
      .link-button:hover {
        background: none;
        color: var(--turf-dark);
        text-decoration-color: currentColor;
      }
      .react-aria-ToggleButton,
      button[aria-pressed] {
        min-height: 2rem;
        padding: 0.25rem 0.875rem;
        border-radius: 999px;
        font-size: 0.875rem;
      }
      .react-aria-ToggleButton[data-selected],
      button[aria-pressed='true'] {
        border-color: var(--turf);
        background: var(--turf-soft);
        color: var(--turf-dark);
        font-weight: 700;
      }
      .actions,
      .dialog-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }
      ul.actions {
        margin: 0.5rem 0;
        padding: 0;
        list-style: none;
      }
      .dialog-actions {
        justify-content: flex-end;
        margin-top: 1.25rem;
      }

      /* ── 欄位與表單 ─────────────────────────────────────────── */
      input:not([type='checkbox'], [type='radio'], [type='file']),
      select,
      textarea {
        box-sizing: border-box;
        max-width: 100%;
        min-height: 2.25rem;
        padding: 0.375rem 0.625rem;
        border: 1px solid var(--rail-strong);
        border-radius: var(--radius-sm);
        background: #ffffff;
        color: var(--ink);
        font: inherit;
        font-size: 0.9375rem;
        font-variant-numeric: tabular-nums;
      }
      input[type='checkbox'],
      input[type='radio'] {
        width: 1rem;
        height: 1rem;
        margin: 0 0.375rem 0 0;
        vertical-align: -0.125rem;
        accent-color: var(--turf);
      }
      input[type='file'] {
        max-width: 100%;
        font: inherit;
        font-size: 0.875rem;
      }
      input[type='file']::file-selector-button {
        margin-right: 0.75rem;
        padding: 0.375rem 0.875rem;
        border: 1px solid var(--rail-strong);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
      .react-aria-Form {
        display: grid;
        justify-items: start;
        gap: 0.75rem;
        margin: 1.25rem 0;
      }
      .react-aria-Form:first-child {
        margin-top: 0;
      }
      .react-aria-Form > * {
        min-width: 0;
        max-width: 100%;
      }
      .react-aria-Form > h3,
      .react-aria-Form > h4 {
        margin: 0.5rem 0 0;
      }
      .react-aria-Form > p {
        margin: 0;
      }
      .react-aria-TextField,
      .react-aria-NumberField,
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        max-width: 100%;
      }
      .react-aria-TextField input,
      .react-aria-NumberField input {
        width: 18rem;
        max-width: 100%;
      }
      .react-aria-Label,
      .field > label {
        color: var(--ink-2);
        font-size: 0.8125rem;
        font-weight: 600;
      }
      .field > label:has(input[type='checkbox']) {
        color: var(--ink);
        font-size: 0.9375rem;
        font-weight: 400;
      }
      .react-aria-RadioGroup {
        display: flex;
        flex-direction: column;
        gap: 0.375rem;
      }
      .react-aria-RadioButton {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
      }
      .react-aria-RadioButton::before {
        content: '';
        box-sizing: border-box;
        flex: none;
        width: 1.125rem;
        height: 1.125rem;
        border: 2px solid var(--rail-strong);
        border-radius: 50%;
        background: #ffffff;
      }
      .react-aria-RadioButton[data-selected]::before {
        border: 5px solid var(--turf);
      }
      .react-aria-RadioButton[data-focus-visible] {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      fieldset {
        margin: 1rem 0;
        padding: 0.75rem 1rem 1rem;
        border: 1px solid var(--rail);
        border-radius: var(--radius);
        background: var(--surface-2);
      }
      legend {
        padding: 0 0.375rem;
        color: var(--ink-2);
        font-size: 0.875rem;
        font-weight: 700;
      }
      .group-picker,
      .filters,
      .field-group,
      .field-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1rem;
        align-items: end;
      }
      .group-picker {
        margin-bottom: 1rem;
      }
      .field-group {
        margin: 0.75rem 0;
        padding: 0.75rem 1rem;
        border: 1px solid var(--rail);
        border-radius: var(--radius-sm);
        background: var(--surface);
      }
      .filters input:not([type='checkbox']) {
        width: 7rem;
      }
      .filters .field:has(input[type='checkbox']) {
        justify-content: center;
        min-height: 2.25rem;
      }

      /* ── 表格與資料清單 ─────────────────────────────────────── */
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 0.9375rem;
        font-variant-numeric: tabular-nums;
      }
      caption {
        padding: 0 0 0.5rem;
        font-weight: 700;
        text-align: left;
      }
      th,
      td {
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid var(--rail);
        text-align: left;
        vertical-align: top;
      }
      thead th {
        border-bottom-color: var(--rail-strong);
        background: var(--surface-2);
        color: var(--ink-2);
        font-size: 0.8125rem;
        white-space: nowrap;
      }
      tbody tr:hover {
        background: #f5f8f6;
      }
      .table-scroll {
        overflow-x: auto;
        border: 1px solid var(--rail);
        border-radius: var(--radius-sm);
      }
      .table-scroll caption {
        padding: 0.625rem 0.75rem;
      }
      .table-scroll :is(td, th) {
        overflow-wrap: normal;
      }
      .table-scroll tbody tr:last-child > * {
        border-bottom: 0;
      }
      dl {
        margin: 0.5rem 0;
      }
      dl > div {
        display: grid;
        grid-template-columns: minmax(6rem, max-content) 1fr;
        gap: 0.75rem;
        padding: 0.25rem 0;
        border-bottom: 1px solid var(--rail);
      }
      dt {
        color: var(--muted);
        font-size: 0.875rem;
      }
      dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }

      /* ── 狀態訊息 ───────────────────────────────────────────── */
      [role='alert'] {
        margin: 0.5rem 0;
        padding: 0.5rem 0.75rem;
        border: 1px solid #f0bdb6;
        border-left: 4px solid var(--silk-red);
        border-radius: var(--radius-sm);
        background: var(--silk-red-soft);
        color: #8c1d14;
      }
      [role='alert'] p,
      [role='alert'] ul {
        margin: 0.25rem 0;
      }
      p[role='status'],
      div[role='status'] {
        margin: 0.5rem 0;
        padding: 0.5rem 0.75rem;
        border-left: 4px solid var(--turf);
        border-radius: var(--radius-sm);
        background: var(--turf-soft);
        color: var(--turf-dark);
      }
      div[role='status'] h3 {
        margin: 0.25rem 0 0.5rem;
      }
      .badge {
        display: inline-block;
        margin-inline-start: 0.25rem;
        padding: 0 0.5rem;
        border: 1px solid var(--dirt-rail);
        border-radius: 999px;
        background: var(--dirt-soft);
        color: var(--dirt);
        font-size: 0.75rem;
        font-weight: 700;
        line-height: 1.6;
        white-space: nowrap;
      }

      /* ── 總覽：年度工作、提醒、任務 ─────────────────────────── */
      [data-testid='annual-work'],
      [data-testid='import-history'],
      .reminders,
      .task-list,
      .task-mares,
      .history-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      [data-testid='annual-work'] > li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem 1rem;
        padding: 0.5rem 0;
        border-bottom: 1px solid var(--rail);
      }
      [data-testid='import-history'] > li {
        padding: 0.375rem 0;
        border-bottom: 1px solid var(--rail);
        font-size: 0.9375rem;
        font-variant-numeric: tabular-nums;
      }
      .reminders > li {
        position: relative;
        padding: 0.3125rem 0 0.3125rem 1rem;
        border-bottom: 1px dashed var(--rail);
        color: var(--ink-2);
        font-size: 0.9375rem;
      }
      .reminders > li::before {
        content: '';
        position: absolute;
        top: 0.8125rem;
        left: 0.125rem;
        width: 0.375rem;
        height: 0.375rem;
        border-radius: 50%;
        background: #c28a2c;
      }
      .task-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr));
        gap: 0.75rem;
      }
      .task-card {
        padding: 0.75rem 1rem;
        border: 1px solid var(--rail);
        border-radius: var(--radius-sm);
        background: var(--surface-2);
      }
      .task-card h4 {
        margin: 0 0 0.375rem;
      }
      .task-card > p {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 0.75rem;
        font-size: 0.875rem;
      }
      .task-mares > li {
        padding: 0.375rem 0;
        border-top: 1px solid var(--rail);
      }

      /* ── 八系：勝負服色塊 ───────────────────────────────────── */
      .line-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr));
        gap: 0.75rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .line-card {
        min-width: 0;
        padding: 0.875rem 1rem 1rem;
        border: 1px solid var(--rail);
        border-left: 6px solid var(--rail-strong);
        border-radius: var(--radius-sm);
        background: var(--surface);
      }
      .line-card > h3,
      .line-card > h4 {
        display: flex;
        align-items: center;
        gap: 0.625rem;
        margin: 0 0 0.5rem;
        font-size: 1.0625rem;
      }
      .line-card > h3::before,
      .line-card > h4::before {
        content: '';
        flex: none;
        width: 1.75rem;
        height: 1.25rem;
        border-radius: 3px;
        background-color: var(--line-color, #e6ebe7);
        background-image: linear-gradient(
          118deg,
          transparent 36%,
          rgb(255 255 255 / 92%) 36% 58%,
          transparent 58%
        );
        box-shadow: inset 0 0 0 1px rgb(0 0 0 / 14%);
      }
      .line-card:not([style]) > h3::before,
      .line-card:not([style]) > h4::before {
        background-image: none;
        box-shadow: inset 0 0 0 1px var(--rail-strong);
      }
      .line-card dl > div {
        grid-template-columns: 1fr auto;
        border-bottom-style: dotted;
      }
      .line-card dd {
        font-weight: 600;
        text-align: right;
      }
      .color-swatch {
        position: relative;
        display: inline-block;
        width: 1.375rem;
        height: 0.9375rem;
        margin-inline-end: 0.375rem;
        overflow: hidden;
        border-radius: 2px;
        vertical-align: -0.125rem;
        box-shadow: inset 0 0 0 1px rgb(0 0 0 / 14%);
      }
      .color-swatch::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          118deg,
          transparent 36%,
          rgb(255 255 255 / 92%) 36% 58%,
          transparent 58%
        );
      }

      /* ── 母馬群 ─────────────────────────────────────────────── */
      [data-testid='mare-group-title'] {
        margin-top: 0.5rem;
        font-size: 1.1875rem;
      }
      .mare-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr));
        gap: 1rem;
        margin: 0.75rem 0;
        padding: 0;
        list-style: none;
      }
      .mare-card {
        min-width: 0;
        padding: 1rem 1rem 0.875rem;
        border: 1px solid var(--rail);
        border-radius: var(--radius);
        background: var(--surface);
        cursor: pointer;
        transition:
          border-color 120ms,
          box-shadow 120ms;
      }
      .mare-card:hover {
        border-color: var(--rail-strong);
        box-shadow: 0 4px 14px rgb(22 32 42 / 10%);
      }
      .mare-card > article {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .mare-name {
        margin: 0 0 0.625rem;
        font-size: 1.1875rem;
        letter-spacing: 0.02em;
      }
      .mare-name .link-button {
        font-weight: 800;
      }
      .mare-card dl {
        margin: 0;
      }
      .mare-card dl > div {
        grid-template-columns: 5.5rem 1fr;
        gap: 0.5rem;
        padding: 0.1875rem 0;
        border-bottom: 0;
      }
      .mare-card dt {
        font-size: 0.8125rem;
      }
      .mare-card dd {
        font-size: 0.9375rem;
      }
      .mare-card .notice {
        margin: 0.375rem 0 0;
        color: var(--dirt);
      }
      .mare-card .actions {
        margin-top: auto;
        padding-top: 0.75rem;
      }
      meter {
        width: 6rem;
        height: 0.625rem;
        margin-inline-end: 0.5rem;
        vertical-align: 0;
      }
      meter::-webkit-meter-bar {
        height: 0.625rem;
        border: 0;
        border-radius: 999px;
        background: #e3e9e5;
      }
      meter::-webkit-meter-optimum-value {
        border-radius: 999px;
        background: var(--turf);
      }
      meter::-webkit-meter-suboptimum-value {
        border-radius: 999px;
        background: #c28a2c;
      }
      meter::-webkit-meter-even-less-good-value {
        border-radius: 999px;
        background: var(--silk-red);
      }
      nav[aria-label='分頁'],
      .pager {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 0.75rem;
        margin-top: 0.75rem;
      }

      /* ── 詳情欄 ─────────────────────────────────────────────── */
      .drawer-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: flex-end;
        background: rgb(22 32 42 / 36%);
      }
      .drawer {
        box-sizing: border-box;
        width: min(34rem, 100%);
        height: 100%;
        overflow-y: auto;
        border-left: 0.5rem solid #1565c0;
        background: var(--drawer-soft);
        box-shadow: -8px 0 28px rgb(0 0 0 / 18%);
      }
      .drawer .dialog {
        padding: 1.25rem 1.5rem 2rem;
      }
      .drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .drawer-header h2,
      .drawer-header h3 {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: 0.02em;
      }
      .drawer dl > div,
      .detail-list > div {
        grid-template-columns: 7rem 1fr;
        border-bottom-color: #d9e3f0;
      }
      .detail-list {
        margin: 0.5rem 0;
      }
      [role='tablist'] {
        display: flex;
        flex-wrap: wrap;
        gap: 0.125rem;
        margin: 1rem 0;
        border-bottom: 1px solid var(--drawer-rail);
      }
      [role='tab'] {
        margin-bottom: -1px;
        padding: 0.5rem 0.875rem;
        border-bottom: 3px solid transparent;
        color: var(--ink-2);
        font-weight: 600;
        cursor: pointer;
      }
      [role='tab'][data-hovered] {
        border-bottom-color: var(--drawer-rail);
      }
      [role='tab'][aria-selected='true'] {
        border-bottom-color: #1565c0;
        color: #0d47a1;
        font-weight: 700;
      }
      .drawer section {
        margin-top: 1.25rem;
      }
      .drawer .field-group,
      .drawer fieldset {
        background: var(--surface);
      }
      .drawer tbody tr:hover {
        background: #e6effa;
      }

      /* ── 配種、產駒、姊妹與種牡馬清單 ───────────────────────── */
      .breeding-list,
      .foal-timeline,
      .sister-list,
      .foal-list,
      .stallion-list {
        margin: 0.5rem 0;
        padding: 0;
        list-style: none;
      }
      .breeding-row,
      .foal-timeline > li,
      .sister-list > li,
      .foal-row,
      .stallion-list > li {
        padding: 0.625rem 0;
        border-bottom: 1px solid var(--rail);
      }
      .drawer .breeding-row,
      .drawer .foal-timeline > li,
      .drawer .sister-list > li {
        border-bottom-color: #d9e3f0;
      }
      .breeding-row p,
      .sister-list p,
      .stallion-list p,
      .foal-card p {
        margin: 0.25rem 0;
      }
      .timeline-year,
      .foal-name {
        margin: 0.25rem 0;
      }
      .foal-timeline > li[data-kind='idle'],
      .foal-timeline > li[data-kind='unregistered'] {
        color: var(--muted);
      }
      .foal-row-main {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.25rem 1rem;
        font-size: 0.9375rem;
        font-variant-numeric: tabular-nums;
      }
      .foal-row-main .link-button {
        font-size: 1rem;
        letter-spacing: 0.02em;
      }
      .foal-panel,
      .stallion-card {
        margin: 0.75rem 0;
        padding: 0.875rem 1rem;
        border: 1px solid var(--rail);
        border-radius: var(--radius-sm);
        background: var(--surface-2);
      }
      .stallion-card h3,
      .stallion-card h4 {
        margin: 0.25rem 0 0.5rem;
      }
      .sex-marker {
        display: inline-block;
        min-width: 1em;
        font-size: 1.125em;
        font-weight: 700;
        line-height: 1;
        text-align: center;
      }
      .sex-male {
        color: #1565c0;
      }
      .sex-female {
        color: #c2185b;
      }

      /* ── 血緣表 ─────────────────────────────────────────────── */
      .pedigree-view {
        margin-top: 0.5rem;
      }
      .pedigree {
        margin: 0.25rem 0;
        padding-inline-start: 1.25rem;
        border-inline-start: 2px solid var(--drawer-rail);
        list-style: none;
      }
      .pedigree > li {
        position: relative;
        padding: 0.125rem 0;
      }
      .pedigree > li::before {
        content: '';
        position: absolute;
        top: 0.8125rem;
        left: -1.25rem;
        width: 0.875rem;
        border-top: 2px solid var(--drawer-rail);
      }
      .pedigree-root {
        padding-inline-start: 0;
        border-inline-start: 0;
      }
      .pedigree-root > li::before {
        display: none;
      }
      .pedigree-role {
        color: var(--muted);
        font-size: 0.8125rem;
      }

      /* ── 年度匯入 ───────────────────────────────────────────── */
      .drop-zone {
        margin: 0.75rem 0;
        padding: 1.25rem;
        border: 2px dashed var(--rail-strong);
        border-radius: var(--radius);
        background: var(--surface-2);
      }
      .may-preview > p:first-child {
        font-weight: 600;
      }

      /* ── 對話框 ─────────────────────────────────────────────── */
      .modal-overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: rgb(22 32 42 / 45%);
      }
      .modal {
        box-sizing: border-box;
        width: 100%;
        max-width: 34rem;
        max-height: 90vh;
        overflow-y: auto;
        border-radius: 12px;
        background: var(--surface);
        box-shadow: 0 20px 48px rgb(0 0 0 / 24%);
      }
      .dialog {
        padding: 1.5rem;
        outline: none;
      }
      .modal .dialog > h2:first-child {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }
      .modal [role='alertdialog'] {
        border-top: 4px solid var(--silk-red);
        border-radius: 12px 12px 0 0;
      }

      /* ── 焦點、窄螢幕與降低動態 ─────────────────────────────── */
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .status-bar :focus-visible {
        outline-color: #9ec5ff;
      }
      @media (max-width: 40rem) {
        .app {
          padding: 0 0.75rem 2rem;
        }
        .status-bar {
          margin: 0 -0.75rem;
          padding: 0.875rem 1rem 0.75rem;
          border-radius: 0;
        }
        .status-bar dl {
          gap: 0.375rem 1.25rem;
        }
        .status-bar [data-testid='status-game'],
        .status-bar [data-testid='status-year'],
        .status-bar [data-testid='status-records'] {
          font-size: 1.0625rem;
        }
        .status-bar .notice {
          font-size: 0.75rem;
        }
        .main-nav button {
          padding: 0.5rem 0.625rem;
        }
        main > section {
          padding: 1rem;
        }
        .dashboard > section {
          padding: 1rem;
        }
        .react-aria-TextField input,
        .react-aria-NumberField input {
          width: 100%;
        }
        dl > div {
          grid-template-columns: 1fr;
          gap: 0;
        }
        .table-scroll table {
          min-width: 36rem;
        }
        .mare-card dl > div,
        .line-card dl > div {
          grid-template-columns: 5.5rem 1fr;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
