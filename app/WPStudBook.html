<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WPStudBook</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, 'Segoe UI', 'Noto Sans TC', sans-serif;
        line-height: 1.5;
      }
      body {
        margin: 0;
      }
      .app {
        max-width: 72rem;
        margin: 0 auto;
        padding: 1rem;
        overflow-wrap: anywhere;
      }
      .status-bar dl {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.5rem;
        margin: 0;
      }
      .status-bar dt,
      .notice {
        font-size: 0.875rem;
        color: #64758a;
      }
      .status-bar dd {
        margin: 0;
      }
      section {
        margin-block: 1.5rem;
      }
      .table-scroll {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        text-align: left;
        padding: 0.25rem 0.5rem;
        border-bottom: 1px solid #d5dbe3;
      }
      .actions,
      .dialog-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .dialog-actions {
        justify-content: flex-end;
        margin-top: 1rem;
      }
      .modal-overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: rgb(0 0 0 / 40%);
      }
      .modal {
        width: 100%;
        max-width: 32rem;
        max-height: 90vh;
        overflow-y: auto;
        border-radius: 0.5rem;
        background: #fff;
      }
      .dialog {
        padding: 1rem;
        outline: none;
      }
      .danger-zone {
        padding: 1rem;
        border: 1px solid #c62828;
        border-radius: 0.5rem;
      }
      .main-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-block: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid #d5dbe3;
      }
      .main-nav button[aria-current='page'] {
        font-weight: 700;
        outline: 2px solid #1f6feb;
      }
      .line-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
        gap: 0.75rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .line-card {
        padding: 0.75rem;
        border: 1px solid #d5dbe3;
        border-left-width: 0.5rem;
        border-radius: 0.5rem;
      }
      .line-card h3 {
        margin: 0 0 0.25rem;
      }
      .line-card dl,
      .line-card dd {
        margin: 0;
      }
      .color-swatch {
        display: inline-block;
        width: 1rem;
        height: 1rem;
        margin-inline-end: 0.25rem;
        border-radius: 0.25rem;
        vertical-align: middle;
      }
      .group-picker,
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        align-items: end;
      }
      .filters {
        margin: 1rem 0;
        padding: 0.75rem;
        border: 1px solid #d5dbe3;
        border-radius: 0.5rem;
      }
      .field label {
        display: block;
      }
      .mare-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
        gap: 0.75rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .mare-card {
        padding: 0.75rem;
        border: 1px solid #d5dbe3;
        border-radius: 0.5rem;
      }
      .mare-card dl,
      .mare-card dd {
        margin: 0;
      }
      .mare-card dl > div {
        display: flex;
        gap: 0.5rem;
      }
      .mare-card dt {
        flex: 0 0 5.5rem;
        color: #64758a;
      }
      .mare-card meter {
        width: 5rem;
        margin-inline-end: 0.5rem;
        vertical-align: middle;
      }
      .mare-name {
        margin: 0 0 0.25rem;
      }
      .badge {
        margin-inline-start: 0.25rem;
        padding: 0 0.25rem;
        border: 1px solid #9e7c00;
        border-radius: 0.25rem;
        font-size: 0.75rem;
      }
      button[aria-pressed='true'] {
        font-weight: 700;
        outline: 2px solid #1f6feb;
      }
      .mare-card {
        cursor: pointer;
      }
      .link-button {
        padding: 0;
        border: none;
        background: none;
        color: #1565c0;
        font: inherit;
        font-weight: 700;
        text-align: left;
        text-decoration: underline;
        cursor: pointer;
      }
      .drawer-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: flex-end;
        background: rgb(0 0 0 / 30%);
      }
      .drawer {
        width: min(32rem, 100%);
        height: 100%;
        overflow-y: auto;
        border-left: 0.5rem solid #1565c0;
        background: #eef4fc;
      }
      .drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .detail-list,
      .detail-list dd {
        margin: 0;
      }
      .detail-list > div {
        display: flex;
        gap: 0.5rem;
      }
      .detail-list dt {
        flex: 0 0 6rem;
        color: #64758a;
      }
      [role='tablist'] {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        margin-block: 0.5rem;
      }
      [role='tab'] {
        padding: 0.25rem 0.5rem;
        border: 1px solid #d5dbe3;
        border-radius: 0.25rem;
        cursor: pointer;
      }
      [role='tab'][aria-selected='true'] {
        border-color: #1565c0;
        background: #fff;
        font-weight: 700;
      }
      [role='alert'] {
        color: #b00020;
      }
      .field-group {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        align-items: end;
        margin: 0.5rem 0;
        padding: 0.5rem;
        border: 1px solid #d5dbe3;
        border-radius: 0.5rem;
      }
      .breeding-list,
      .foal-timeline,
      .sister-list,
      .foal-list {
        margin: 0.5rem 0;
        padding: 0;
        list-style: none;
      }
      .breeding-row,
      .foal-timeline > li,
      .sister-list > li,
      .foal-row {
        padding: 0.5rem 0;
        border-bottom: 1px solid #d5dbe3;
      }
      .breeding-row p,
      .sister-list p,
      .foal-card p {
        margin: 0.25rem 0;
      }
      .timeline-year,
      .foal-name {
        margin: 0.25rem 0;
      }
      .foal-timeline > li[data-kind='idle'],
      .foal-timeline > li[data-kind='unregistered'] {
        color: #64758a;
      }
      .foal-row-main {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 0.75rem;
        align-items: baseline;
      }
      .foal-panel {
        margin-top: 0.5rem;
        padding: 0.5rem;
        border: 1px solid #d5dbe3;
        border-radius: 0.5rem;
        background: #fff;
      }
      .sex-marker {
        display: inline-block;
        min-width: 1em;
        font-weight: 700;
        text-align: center;
      }
      .sex-male {
        color: #1565c0;
      }
      .sex-female {
        color: #c2185b;
      }
      .stallion-card {
        margin-block: 0.75rem;
        padding: 0.75rem;
        border: 1px solid #d5dbe3;
        border-radius: 0.5rem;
      }
      .stallion-card h3,
      .stallion-card h4 {
        margin: 0.5rem 0 0.25rem;
      }
      .reminders,
      .stallion-list {
        margin: 0.25rem 0;
        padding: 0;
        list-style: none;
      }
      .stallion-list > li {
        padding: 0.5rem 0;
        border-bottom: 1px solid #d5dbe3;
      }
      .stallion-list p {
        margin: 0.25rem 0;
      }
      .pedigree {
        margin: 0.25rem 0;
        padding-inline-start: 1rem;
        border-inline-start: 1px solid #d5dbe3;
        list-style: none;
      }
      .pedigree-root {
        padding-inline-start: 0;
        border-inline-start: 0;
      }
      .pedigree-role {
        color: #64758a;
      }
      :focus-visible {
        outline: 2px solid #1f6feb;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
