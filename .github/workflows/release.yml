name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: 檢查與建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 確認標籤指向 main 分支上的 commit
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "標籤 $GITHUB_REF_NAME 指向的 commit 不在 main 分支上，停止發布" >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: 確認標籤與 package.json 版本一致
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "標籤 $GITHUB_REF_NAME 與 package.json 版本 $expected 不一致" >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WPStudBook-html
          path: app/dist/WPStudBook.html
          if-no-files-found: error

  e2e:
    name: 端到端（${{ matrix.browser }}）
    needs: check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [msedge, chrome]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: WPStudBook-html
          path: app/dist
      - name: 執行端到端測試
        run: npm run e2e
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
      - name: 保存失敗報告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            app/playwright-report
            app/test-results

  publish:
    name: 建立 GitHub Release
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 必須在下一步之前執行：此 job 沒有 checkout，這一步會建立 working-directory: app 所需的 app/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: WPStudBook-html
          path: app/dist
      - name: 發布並附上 WPStudBook.html
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/WPStudBook.html
          --repo "$GITHUB_REPOSITORY"
          --title "WPStudBook $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
