name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: app

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 檢查與建置
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.changes.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 判斷是否只改文件
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "${{ github.sha }}" | grep -Ev '^docs/|\.md$' > /dev/null; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: WPStudBook-html
          path: app/dist/WPStudBook.html
          if-no-files-found: error

  e2e:
    name: 端到端（${{ matrix.browser }}）
    needs: check
    if: needs.check.outputs.code_changed == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [msedge, chrome]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: WPStudBook-html
          path: app/dist
      - name: 執行端到端測試
        run: npm run e2e
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
      - name: 保存失敗報告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            app/playwright-report
            app/test-results
